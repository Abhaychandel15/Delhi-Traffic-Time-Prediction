<!DOCTYPE html>
<html>
<head>
  <title>Delhi Traffic Time Predictor</title>
</head>
<body>

<h2>Delhi Traffic Travel Time Prediction</h2>

<form action="/predict" method="post">

<label>Start Area:</label>
<input type="text"
       name="start_area"
       placeholder="Enter ANY Delhi area"
       list="area_list"
       required><br><br>

<label>End Area:</label>
<input type="text"
       name="end_area"
       placeholder="Enter ANY Delhi area"
       list="area_list"
       required><br><br>

<datalist id="area_list">
  {% for a in known_areas %}
    <option value="{{ a }}">
  {% endfor %}
</datalist>

<label>Distance (km):</label>
<input type="number" step="0.1" name="distance" required><br><br>

<label>Time of Day:</label>
<select name="time_of_day" required>
  {% for t in time_of_day %}
    <option value="{{ t }}">{{ t }}</option>
  {% endfor %}
</select><br><br>

<label>Day of Week:</label>
<select name="day" required>
  {% for d in days %}
    <option value="{{ d }}">{{ d }}</option>
  {% endfor %}
</select><br><br>

<label>Weather Condition:</label>
<select name="weather" required>
  {% for w in weather %}
    <option value="{{ w }}">{{ w }}</option>
  {% endfor %}
</select><br><br>

<label>Traffic Density Level:</label>
<select name="traffic_density" required>
  {% for t in traffic_density %}
    <option value="{{ t }}">{{ t }}</option>
  {% endfor %}
</select><br><br>

<label>Road Type:</label>
<select name="road_type" required>
  {% for r in road_types %}
    <option value="{{ r }}">{{ r }}</option>
  {% endfor %}
</select><br><br>

<label>Average Speed (kmph):</label>
<input type="number" step="1" name="avg_speed" required><br><br>

<button type="submit">Predict Travel Time</button>

</form>

</body>
</html>
